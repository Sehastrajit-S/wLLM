name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # GitHub-hosted runners have no NVIDIA GPU, so every test that needs
    # CUDA self-skips (pytest.skip("CUDA not available"), the same guard
    # used when running this suite locally without a GPU) -- this job
    # verifies imports, packaging, and every CPU-only test (kernel-free
    # logic: sampling, tokenization, scheduler bookkeeping, schemas, etc.),
    # not full model-level correctness. That still needs a real GPU runner,
    # which this repo doesn't have configured.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite (CUDA-only tests self-skip on this runner)
        # Batched runner, not a single `pytest tests/` invocation: on a real
        # GPU box this suite loads dozens of models across 30+ files in one
        # process, which can exhaust VRAM regardless of which code is under
        # test (see scripts/run_tests.py's docstring). Harmless but still
        # the right habit on a GPU-less CI runner too, so local and CI runs
        # match.
        run: python scripts/run_tests.py -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check src/ tests/ scripts/
